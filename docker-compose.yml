services:
  postgres:
    image: postgres:16-alpine
    container_name: leosgyr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leosgyr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leosgyr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-leosgyr_dev}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - leosgyr_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-leosgyr} -d ${POSTGRES_DB:-leosgyr_dev}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leosgyr-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - leosgyr_redis_data:/data
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  leosgyr_postgres_data:
  leosgyr_redis_data:
